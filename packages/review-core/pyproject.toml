[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "review-core"
version = "0.1.0"
requires-python = "==3.14.7"
dependencies = ["anyio==4.15.0", "rfc8785==0.1.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/review_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/review_core/py.typed" = "review_core/py.typed"
