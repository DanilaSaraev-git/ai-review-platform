events {}

http {
  include /etc/nginx/mime.types;
  # PDF.js uses an ES module worker; nginx's default map omits .mjs.
  types { application/javascript mjs; }
  default_type application/octet-stream;

  map $http_x_forwarded_proto $review_external_scheme {
    default $scheme;
    http http;
    https https;
  }
  server_tokens off;
  access_log off;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 52m;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_redirect ~^http://([^/]+)(/.*)$ $review_external_scheme://$1$2;

    location = /demo {
      absolute_redirect off;
      return 308 /demo/;
    }

    # The demo has no server-side API or model fallback.
    location ^~ /demo/api/ {
      default_type application/problem+json;
      return 503 '{"title":"Demo worker is not active","status":503,"code":"demo_unavailable"}';
    }

    # Prepared case materials are private runtime data, never image contents.
    location ^~ /demo/data/ {
      alias /var/lib/review-demo/;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      limit_except GET HEAD { deny all; }
    }

    location /demo/ {
      try_files $uri $uri/ /demo/index.html;
    }

    location /api/ {
      proxy_read_timeout 330s;
      proxy_send_timeout 330s;
      rewrite ^/api(/.*)$ $1 break;
      proxy_pass http://api:8000;
    }

    location /v1/ {
      proxy_read_timeout 330s;
      proxy_send_timeout 330s;
      proxy_pass http://api:8000;
    }

    location = /docs {
      proxy_pass http://api:8000/docs;
    }

    location /docs/ {
      proxy_pass http://api:8000;
    }

    location = /openapi.json {
      proxy_pass http://api:8000/openapi.json;
    }

    location /health/ {
      proxy_pass http://api:8000/health/;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
