name: review-platform

x-runtime-environment: &runtime-environment
  REVIEW_COMPOSITION: durable
  REVIEW_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-review}:${POSTGRES_PASSWORD:-review-local-only}@postgres/${POSTGRES_DB:-review}
  REVIEW_QUEUE_DATABASE_URL: postgresql://${POSTGRES_USER:-review}:${POSTGRES_PASSWORD:-review-local-only}@postgres/${POSTGRES_DB:-review}
  REVIEW_ARTIFACT_ROOT: /var/lib/review/artifacts
  REVIEW_RUNTIME_CONFIG_PATH: /app/config/runtime-config.synthetic.v1.json
  REVIEW_EXPECTED_OUTPUT_PATH: /app/config/trusted-fixture-output.synthetic.v1.json
  REVIEW_DEPLOYMENT_ID: ${REVIEW_DEPLOYMENT_ID:-60000000-0000-4000-8000-000000000001}
  REVIEW_ORGANIZATION_ID: ${REVIEW_ORGANIZATION_ID:-30000000-0000-4000-8000-000000000001}
  REVIEW_ORGANIZATION_NAME: ${REVIEW_ORGANIZATION_NAME:-Synthetic Organization}
  REVIEW_WORKSPACE_ID: ${REVIEW_WORKSPACE_ID:-20000000-0000-4000-8000-000000000001}
  REVIEW_WORKSPACE_NAME: ${REVIEW_WORKSPACE_NAME:-Synthetic Workspace}
  REVIEW_ACTOR_ID: ${REVIEW_ACTOR_ID:-10000000-0000-4000-8000-000000000001}
  REVIEW_ACTOR_DISPLAY_NAME: ${REVIEW_ACTOR_DISPLAY_NAME:-Synthetic Analyst}
  REVIEW_SYSTEM_PROFILE_ID: ${REVIEW_SYSTEM_PROFILE_ID:-50000000-0000-4000-8000-000000000001}
  REVIEW_MODEL_PROFILE_ID: ${REVIEW_MODEL_PROFILE_ID:-deterministic-v1}
  REVIEW_DIALOGUE_POLICY_ID: ${REVIEW_DIALOGUE_POLICY_ID:-default-dialogue}
  REVIEW_SKILL_ID: ${REVIEW_SKILL_ID:-review-data-spec}
  REVIEW_SKILL_PACKAGE_SHA256: ${REVIEW_SKILL_PACKAGE_SHA256:-dda6f8e1dbbabb94132ee4530e0f592ec3164347a567999d97a6f613a3ea78e5}

x-app-image: &app-image
  build:
    context: ../..
    dockerfile: deploy/compose/Dockerfile
  image: review-platform-mvp:local

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-review}
      POSTGRES_USER: ${POSTGRES_USER:-review}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-review-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - internal

  artifact-init:
    <<: *app-image
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/lib/review/artifacts && chown -R review:review /var/lib/review"]
    volumes:
      - artifacts:/var/lib/review
    restart: "no"

  migrate:
    <<: *app-image
    command: ["uv", "run", "--frozen", "alembic", "-c", "packages/review-runtime/alembic.ini", "upgrade", "head"]
    environment:
      <<: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  api:
    <<: *app-image
    command: ["uvicorn", "review_api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *runtime-environment
    volumes:
      - artifacts:/var/lib/review
      - ./config:/app/config:ro
    depends_on:
      artifact-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - internal

  proxy:
    image: nginx:1.29.4-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${REVIEW_PROXY_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - internal
      - edge

  worker:
    <<: *app-image
    profiles: ["deferred-queue"]
    command: ["procrastinate", "--app=review_worker.procrastinate_app", "worker"]
    environment:
      <<: *runtime-environment
    volumes:
      - artifacts:/var/lib/review
      - ./config:/app/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

networks:
  internal:
    internal: true
  edge: {}

volumes:
  postgres-data: {}
  artifacts: {}
