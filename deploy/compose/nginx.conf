events {}
http {
  server {
    listen 8080;
    client_max_body_size 52m;
    location /api/ {
      proxy_read_timeout 330s;
      proxy_send_timeout 330s;
      proxy_pass http://api:8000/;
    }
    location / {
      proxy_read_timeout 330s;
      proxy_send_timeout 330s;
      proxy_pass http://api:8000/;
    }
  }
}
